services:
#  mssql:
 #   image: mcr.microsoft.com/mssql/server:2025-latest
  #  restart: unless-stopped
   # container_name: mssql
    #environment:
     # ACCEPT_EULA: "y"
      #MSSQL_PID: "EnterpriseDeveloper"
      
#      MSSQL_SA_PASSWORD: "${MSSQL_SA_PWD:?}"
 #   networks:
  #    - mssql

  postgres:
    image: postgres:18.3
    restart: unless-stopped
    container_name: "postgres"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?}"
      POSTGRES_PASSWORD: "${POSTGRES_PWD:?}"
      POSTGRES_DB: "${POSTGRES_DB:?}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "${POSTGRES_DB}", "-U", "${POSTGRES_USER}"]
      interval: 15s
      timeout: 30s
      retries: 5
      start_period: 20s
      start_interval: 10s
    networks:
      - postgres

  cassandra:
    image: cassandra:5.0.6
    restart: unless-stopped
    container_name: "cassandra"
    environment:
      CASSANDRA_USER: "${CASSANDRA_USER:?}"
      CASSANDRA_PASSWORD: "${CASSANDRA_PWD:?}"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -u ${CASSANDRA_USER} -p ${CASSANDRA_PWD}"]
      interval: 15s
      timeout: 30s
      retries: 5
      start_period: 60s
      start_interval: 60s
    networks:
      - cassandra

  # cassandra doesnt have entrypoint scripts by default
  cassandra-init:
    image: cassandra:5.0.6
    restart: no
    container_name: "cassandra-init"
    command: cqlsh cassandra -f /schema/create_schema.cql
    environment:
      CASSANDRA_USER: "notimportant"
      CASSANDRA_PASSWORD: "notimportant"
    volumes:
      - "./schema/widecolumn:/schema"
    networks:
      - cassandra
    depends_on:
      cassandra:
        condition: service_healthy

#  scylla:
 #   image: scylladb/scylla:2025.3
  #  restart: unless-stopped
   # container_name: "scylladb"
    #networks:
     # - scylla

  backend:
    build:
      context: .
      dockerfile: "bench.Dockerfile"
      target: runner
    container_name: "backend"
    ports:
      - "8080:8080"
    networks:
      - mssql
      - postgres
      - cassandra
      - scylla
      - external
    depends_on:
#      mssql:
#        condition: service_healthy
      postgres:
        condition: service_healthy
      cassandra-init:
        condition: service_completed_successfully
#      scylla:
#        condition: service_healthy

networks:
  mssql:
    name: mssql
    internal: true
  postgres:
    name: postgres
    internal: true
  cassandra:
    name: cassandra
    internal: true
  scylla:
    name: scylla
    internal: true
  external:
    name: external
